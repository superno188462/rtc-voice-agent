[project]
name = "rtc-aigc-python-server"
version = "1.0.0"
description = "Python implementation compatible with the rtc-aigc-demo Node server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-gateway-client",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "openai>=1.0.0,<2.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "websockets>=15,<18",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
agent-gateway-client = { path = "../../gateway_api", editable = true }
