name: rtc-agent

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rtc_agent}
      POSTGRES_USER: ${POSTGRES_USER:-rtc_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtc_agent} -d ${POSTGRES_DB:-rtc_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: deploy/python.Dockerfile
      args:
        GATEWAY_SDK_REF: ${GATEWAY_SDK_REF:-b69f4b04b1874507985d831ce83467f7d0cc0025}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../python_server/scenes:/app/scenes:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/openapi.json', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        REACT_APP_API_HOST: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
